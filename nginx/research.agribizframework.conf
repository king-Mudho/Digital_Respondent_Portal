# nginx site config for research.agribizframework.com (ABF-FST Digital
# Respondent Portal). Shares the Nginx instance with the sibling ABI
# project (agribizframework.com apex) on the same VPS -- a completely
# separate server{} block, own upstreams, own TLS certificate. No
# navigational or infrastructure link to ABI's config
# (docs/20_EMBEDDING_WITH_ABI.md).
#
# Install to: /etc/nginx/conf.d/research.agribizframework.conf
#
#   /                -> Next.js SSR frontend (127.0.0.1:3100)
#   /api/v1/         -> Django/gunicorn      (127.0.0.1:8100)
#   /api/schema/     -> Django/gunicorn      (127.0.0.1:8100)
#   /api/docs/       -> Django/gunicorn      (127.0.0.1:8100)
#   /api/auth/       -> Next.js SSR frontend (127.0.0.1:3100) -- Next's own
#                        login/logout/session routes (frontend/app/api/auth/)
#   /api/proxy/      -> Next.js SSR frontend (127.0.0.1:3100) -- the httpOnly-
#                        cookie relay (frontend/app/api/proxy/[...path]/)
#   /django-admin/   -> Django/gunicorn      (127.0.0.1:8100)
#   /static/         -> Django admin/DRF-browsable-API assets from disk
#   /media/          -> Django user-uploaded files from disk
#
# IMPORTANT: Django's own URLconf (config/urls.py) only ever mounts
# api/v1/, api/schema/ and api/docs/ -- it does NOT own the bare /api/
# prefix. /api/auth/ and /api/proxy/ are Next.js API routes (the JWT
# httpOnly-cookie relay pattern, docs/07_FRONTEND_ARCHITECTURE.md) and must
# be proxied to drp_frontend, not drp_backend. A single catch-all
# `location /api/ { proxy_pass http://drp_backend; }` silently hijacks
# those two paths to Django, which has no route for them -> 404 on every
# login attempt and every dashboard fetch. Confirmed in production: see the
# Sep 2026 hardening-pass fix that replaced that single block with the
# three precise backend prefixes below.
#
# Ports 3100/8100 (not ABI's 3000/8000) so both apps' loopback-bound
# upstreams can never collide on the same box.
#
# Same "let Certbot own the HTTPS block" rule as ABI's own config (see the
# sibling project's docs/PRODUCTION_ARCHITECTURE.md "The 127.0.0.1 lesson"):
# this file has ONE :80 server block. `certbot --nginx --redirect` rewrites
# it to add the :443 block, certificate paths and the HTTP->HTTPS redirect.
# Do not hand-write a :443 block here.
#
#   curl --resolve research.agribizframework.com:443:127.0.0.1 https://research.agribizframework.com/

upstream drp_frontend {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream drp_backend {
    server 127.0.0.1:8100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name research.agribizframework.com;

    access_log /var/log/nginx/drp-access.log;
    error_log  /var/log/nginx/drp-error.log;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Defence in depth on top of the invitation-token gate -- this portal
    # must never be crawlable or indexed (docs/20_EMBEDDING_WITH_ABI.md).
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------------- backend
    # Only Django's actual mounted prefixes -- NOT a bare /api/ catch-all,
    # which would also swallow the frontend's own /api/auth/ and
    # /api/proxy/ routes below (see the comment block above).

    location /api/v1/ {
        proxy_pass http://drp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location /api/schema/ {
        proxy_pass http://drp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /api/docs/ {
        proxy_pass http://drp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # /api/auth/ and /api/proxy/ are Next.js's own routes -- deliberately
    # NOT proxied to the backend here. They fall through to the generic
    # `location /` block below, which already points at drp_frontend.

    # Django admin mounted at "django-admin/", not "admin/" -- the frontend
    # owns bare "/admin" as the Research Operations Centre
    # (docs/07_FRONTEND_ARCHITECTURE.md), same fix as the sibling ABI
    # project uses for the identical collision.
    location /django-admin/ {
        proxy_pass http://drp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /static/ {
        alias /srv/agribiz-drp/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/agribiz-drp/backend/media/;
        access_log off;
    }

    # --------------------------------------------------------------- frontend

    location /_next/static/ {
        proxy_pass http://drp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://drp_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
